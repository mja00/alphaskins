plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'dev.architectury.loom' version '1.7-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'dev.kikugie.stonecutter' version '0.5.3'
}

stonecutter {
    // This will be populated by the settings.gradle configuration
}

architectury {
    minecraft = stonecutter.current.project.version
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.mod_group_id

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.kikugie.dev/releases' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${stonecutter.current.project.version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// Define shared properties
ext {
    mod_version = '1.21-5.0.0'
    mod_group_id = 'dev.mja00.alphaskins'
    mod_id = 'alphaskins'
    mod_name = 'Alphaskins'
    mod_license = 'GPL3'
    mod_authors = 'mja00'
    mod_description = 'Enable transparency in skins'
}
